name: Security CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Secret scanning over the full diff/history reachable from the push
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit tests (security & regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.1 requires Gradle >= 9.3.1 (it hard-fails on older versions).
          # This project has no committed Gradle wrapper, so the version is pinned here.
          gradle-version: 9.3.1
      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

  debug-build:
    name: Debug APK assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      # No keystore is committed (by design): the debug build type falls back to
      # AGP's default debug signing when debug.keystore is absent, so this works
      # on a fresh checkout.
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Run Android Lint (debug variant)
        run: gradle lintDebug --no-daemon --stacktrace

  codeql:
    name: CodeQL analysis (Java/Kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      # AGP 9.1.1 requires Gradle >= 9.3.1; autobuild cannot know that, so we
      # compile the debug variant explicitly for CodeQL extraction.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build for CodeQL extraction
        run: gradle compileDebugSources --no-daemon --stacktrace
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
